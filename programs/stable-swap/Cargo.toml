[package]
name = "stabble-stable-swap"
version = "1.0.0"
edition = "2021"

[features]
default = ["cpi"]
cpi = ["no-entrypoint"]
no-entrypoint = []
jupiter-amm = [
    "dep:anyhow",
    "dep:rust_decimal",
    "dep:jupiter-amm-interface",
    "dep:solana-pubkey",
    "dep:spl-token-interface",
    "dep:spl-associated-token-account-interface",
]

[dependencies]
anchor-lang = { workspace = true }
anyhow = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
jupiter-amm-interface = { workspace = true, optional = true }
solana-pubkey = { workspace = true, optional = true }
spl-token-interface = { workspace = true, optional = true }
spl-associated-token-account-interface = { workspace = true, optional = true }
bn = { path = "../../libraries/bn" }
math = { path = "../../libraries/math" }
stabble-vault = { path = "../vault" }
